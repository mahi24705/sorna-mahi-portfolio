<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Page Not Found | Sorna Mahi S A</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet" />
    <style>
      body {
        margin: 0;
        background-color: #050811;
        color: #e2e8f0;
        font-family: 'Inter', sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
        padding: 1.5rem;
      }
      .card {
        background: rgba(13, 19, 34, 0.85);
        border: 1px solid rgba(139, 92, 246, 0.25);
        border-radius: 1.25rem;
        padding: 3rem 2rem;
        max-width: 480px;
        box-shadow: 0 20px 40px -15px rgba(0,0,0,0.7), 0 0 30px -10px rgba(139, 92, 246, 0.2);
      }
      .code {
        font-family: 'Poppins', sans-serif;
        font-size: 5rem;
        font-weight: 800;
        background: linear-gradient(135deg, #c084fc 0%, #818cf8 50%, #38bdf8 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        line-height: 1;
        margin-bottom: 0.5rem;
      }
      h1 {
        font-family: 'Poppins', sans-serif;
        font-size: 1.5rem;
        margin: 0.5rem 0 1rem;
        color: #ffffff;
      }
      p {
        color: #94a3b8;
        font-size: 0.95rem;
        line-height: 1.5;
        margin-bottom: 2rem;
      }
      a.btn {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        background: linear-gradient(135deg, #9333ea, #3b82f6);
        color: #ffffff;
        text-decoration: none;
        padding: 0.75rem 1.5rem;
        border-radius: 0.75rem;
        font-weight: 600;
        font-size: 0.9rem;
        transition: transform 0.2s, box-shadow 0.2s;
      }
      a.btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 20px -5px rgba(147, 51, 234, 0.5);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="code">404</div>
      <h1>Page Not Found</h1>
      <p>The page you are looking for doesn't exist or has been moved. Explore the portfolio of Sorna Mahi S A instead.</p>
      <a href="/" class="btn">
        <span>Back to Portfolio</span>
        <span>&rarr;</span>
      </a>
    </div>
  </body>
</html>
